<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprunter un livre</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        <h1 class="text-xl font-bold text-slate-800 mb-2">Emprunter un livre</h1>
        <p class="text-slate-500 text-sm mb-6">Livre : <strong class="text-slate-700">"{{ livre.titre }}"</strong></p>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="nom_emprunteur" class="block text-sm font-medium text-slate-700 mb-1">Nom de l'emprunteur :</label>
                <input type="text" name="nom_emprunteur" id="nom_emprunteur" required 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800">
            </div>
            
            <div class="flex space-x-3 pt-2">
                <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg transition shadow cursor-pointer">
                    Confirmer l'emprunt
                </button>
                <a href="{% url 'liste_livres' %}" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 px-4 rounded-lg transition text-center">
                    Annuler
                </a>
            </div>
        </form>
    </div>

</body>
</html>
