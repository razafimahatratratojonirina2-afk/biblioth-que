<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer un livre</title>
</head>
<body>
    <h1>Supprimer le livre</h1>
    
    <p>Êtes-vous sûr de vouloir supprimer le livre <strong>"{{ livre.titre }}"</strong> (Auteur : {{ livre.auteur }}) ?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white; padding: 10px; border: none; cursor: pointer;">
            Oui, supprimer
        </button>
        <a href="{% url 'liste_livres' %}" style="margin-left: 10px;">Annuler</a>
    </form>
</body>
</html>
